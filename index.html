<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050608" />
  <title>Chrome Chamber // Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="hud">
      <div class="panel enemy-panel">
        <div class="panel-label">상대 기체</div>
        <div id="enemyIntegrity" class="integrity"></div>
      </div>

      <div class="center-status">
        <div class="game-title">CHROME CHAMBER</div>
        <div id="turnLabel" class="turn-label">초기화 중...</div>
      </div>

      <div class="panel player-panel">
        <div class="panel-label">내 기체</div>
        <div id="playerIntegrity" class="integrity"></div>
      </div>
    </header>

    <main class="viewport">
      <div id="cameraRig" class="camera-rig">
        <div class="scene">
          <div class="back-wall"></div>
          <div class="vignette"></div>
          <div class="neon-glow left"></div>
          <div class="neon-glow right"></div>
          <div class="dealer-emblem"></div>

          <div id="enemyRobot" class="robot enemy">
            <div class="robot-head"></div>
            <div class="robot-neck"></div>
            <div class="robot-torso"></div>
            <div class="robot-arm arm-left"></div>
            <div class="robot-arm arm-right"></div>
            <div class="robot-leg leg-left"></div>
            <div class="robot-leg leg-right"></div>
            <div class="robot-core"></div>
            <div class="robot-eye"></div>
          </div>

          <div id="playerRobot" class="robot player">
            <div class="robot-head"></div>
            <div class="robot-neck"></div>
            <div class="robot-torso"></div>
            <div class="robot-arm arm-left"></div>
            <div class="robot-arm arm-right"></div>
            <div class="robot-leg leg-left"></div>
            <div class="robot-leg leg-right"></div>
            <div class="robot-core"></div>
            <div class="robot-eye"></div>
          </div>

          <div class="table-zone">
            <div class="table-shadow"></div>
            <div class="table-top"></div>
            <div class="table-edge"></div>

            <div id="ammoReveal" class="ammo-reveal hidden">
              <div class="reveal-header">CHAMBER SCAN</div>
              <div class="ammo-stats">
                <div class="ammo-stat">
                  <span class="stat-name">총 탄환</span>
                  <strong id="ammoTotal">0</strong>
                </div>
                <div class="ammo-stat live">
                  <span class="stat-name">실탄</span>
                  <strong id="ammoLive">0</strong>
                </div>
                <div class="ammo-stat blank">
                  <span class="stat-name">공포탄</span>
                  <strong id="ammoBlank">0</strong>
                </div>
              </div>
              <div id="shellSlots" class="shell-slots"></div>
            </div>

            <div id="shotgun" class="shotgun lowered">
              <div class="barrels">
                <div class="barrel"></div>
                <div class="barrel"></div>
              </div>
              <div class="break-joint"></div>
              <div class="receiver"></div>
              <div class="stock"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <section class="bottom-ui">
      <div id="subtitle" class="subtitle">준비 중...</div>
      <div class="controls">
        <button id="shootSelfBtn" class="action-btn">내 기체에게 발사</button>
        <button id="shootEnemyBtn" class="action-btn primary">상대 기체에게 발사</button>
        <button id="restartBtn" class="action-btn ghost">다시 시작</button>
      </div>
      <div id="logBox" class="log-box"></div>
    </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
