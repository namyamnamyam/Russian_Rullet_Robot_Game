<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#020202" />
  <title>Chrome Chamber // Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="stage-shell">
    <div class="film-grain" aria-hidden="true"></div>
    <div class="screen-lines" aria-hidden="true"></div>
    <div class="edge-vignette" aria-hidden="true"></div>

    <main class="viewport">
      <div id="cameraRig" class="camera-rig">
        <div class="scene">
          <div class="void-bg"></div>
          <div class="rear-red-haze"></div>

          <div class="cable cable-a"></div>
          <div class="cable cable-b"></div>
          <div class="cable cable-c"></div>

          <div class="studio-lamp lamp-left" aria-hidden="true">
            <div class="lamp-core"></div>
            <div class="door top"></div>
            <div class="door bottom"></div>
            <div class="door left"></div>
            <div class="door right"></div>
          </div>

          <div class="studio-lamp lamp-right" aria-hidden="true">
            <div class="lamp-core"></div>
            <div class="door top"></div>
            <div class="door bottom"></div>
            <div class="door left"></div>
            <div class="door right"></div>
          </div>

          <aside class="speaker-stack" aria-hidden="true">
            <div class="speaker-box">
              <div class="speaker big"></div>
              <div class="speaker small"></div>
            </div>
            <div class="speaker-box lower">
              <div class="speaker mid"></div>
            </div>
          </aside>

          <aside class="right-terminal" aria-label="테이블 단말기">
            <div class="terminal-shell">
              <div class="terminal-screen">
                <div class="terminal-head"><span>DEALER / YOU</span></div>
                <div id="logBox" class="log-box">링크 대기 중...</div>
                <div class="terminal-meter"><div class="meter-line"></div></div>
              </div>
            </div>
          </aside>

          <div class="status enemy-status">
            <span>DEALER</span>
            <div id="enemyIntegrity" class="integrity" aria-label="상대 기체 내구도"></div>
          </div>
          <div class="status player-status">
            <span>YOU</span>
            <div id="playerIntegrity" class="integrity" aria-label="내 기체 내구도"></div>
          </div>

          <div class="titleplate">
            <small>ILLEGAL REMOTE TABLE</small>
            <strong>CHROME CHAMBER</strong>
            <span id="turnLabel">초기화 중...</span>
          </div>

          <div id="enemyRobot" class="dealer-entity" aria-label="회색 로봇 딜러">
            <div class="dealer-shadow"></div>
            <div class="dealer-head">
              <div class="head-crack"></div>
              <div class="eye eye-left"></div>
              <div class="eye eye-right"></div>
              <div class="mouth"><i></i><i></i><i></i><i></i><i></i><i></i></div>
            </div>
            <div class="dealer-hand hand-left">
              <div class="palm"></div><div class="finger f1"></div><div class="finger f2"></div><div class="finger f3"></div><div class="finger f4"></div>
            </div>
            <div class="dealer-hand hand-right">
              <div class="palm"></div><div class="finger f1"></div><div class="finger f2"></div><div class="finger f3"></div><div class="finger f4"></div>
            </div>
          </div>

          <div id="playerRobot" class="player-hit-proxy" aria-hidden="true"></div>

          <div class="table-zone">
            <div class="table-shadow"></div>
            <div class="table-back-edge"></div>
            <div class="table-plane">
              <div class="table-grime"></div>
              <div class="table-grid"></div>
              <div class="table-arc"></div>
              <div class="table-mark table-left">House</div>
              <div class="table-mark table-you">You</div>
              <div class="table-mark table-dealer">Dealer</div>
            </div>
            <div class="table-front-edge"></div>

            <div class="prop loop loop-a" aria-hidden="true"></div>
            <div class="prop loop loop-b" aria-hidden="true"></div>
            <div class="prop card-box box-a" aria-hidden="true"></div>
            <div class="prop card-box box-b" aria-hidden="true"></div>
            <div class="prop can can-a" aria-hidden="true"><span>CM</span></div>
            <div class="prop can can-b" aria-hidden="true"><span>CM</span></div>
            <div class="prop can can-c" aria-hidden="true"><span>CM</span></div>
            <div class="prop shell loose-shell" aria-hidden="true"></div>
            <div class="prop shell dark-shell" aria-hidden="true"></div>

            <div id="ammoReveal" class="ammo-reveal hidden">
              <div class="ammo-title"><strong>CHAMBER REPORT</strong><small>LOAD SCAN</small></div>
              <div class="ammo-stats">
                <div class="ammo-stat"><span>TOTAL</span><strong id="ammoTotal">0</strong></div>
                <div class="ammo-stat live"><span>LIVE</span><strong id="ammoLive">0</strong></div>
                <div class="ammo-stat blank"><span>BLANK</span><strong id="ammoBlank">0</strong></div>
              </div>
              <div id="shellSlots" class="shell-slots" aria-label="탄 구성"></div>
            </div>

            <div id="shotgun" class="shotgun lowered" aria-label="경기용 더블배럴 샷건">
              <div class="barrels"><div class="barrel top"></div><div class="barrel bottom"></div></div>
              <div class="pump"></div>
              <div class="receiver"></div>
              <div class="trigger"></div>
              <div class="stock"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <section class="bottom-ui">
      <div class="subtitle-shell"><span class="subtitle-tag">SYSTEM</span><div id="subtitle" class="subtitle">준비 중...</div></div>
      <div class="controls">
        <button id="shootSelfBtn" class="action-btn self-btn" type="button">
          <span class="btn-no">01</span><span class="btn-copy"><strong>나</strong><small>내 기체를 겨눈다</small></span>
        </button>
        <button id="shootEnemyBtn" class="action-btn enemy-btn" type="button">
          <span class="btn-no">02</span><span class="btn-copy"><strong>딜러</strong><small>상대 기체를 겨눈다</small></span>
        </button>
        <button id="restartBtn" class="action-btn ghost restart-btn" type="button">
          <span class="btn-no">↻</span><span class="btn-copy"><strong>재시작</strong><small>세션 초기화</small></span>
        </button>
      </div>
    </section>
  </div>
  <script src="game.js"></script>
</body>
</html>
